<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">InfoPulse PL — SWIR information dashboard</title>
  <desc id="desc">Dark electric-cyan InfoPulse PL banner with an information pulse and dashboard nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#02050A"/><stop offset="0.55" stop-color="#06101A"/><stop offset="1" stop-color="#02050A"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0088FF"/><stop offset="0.5" stop-color="#62E5FF"/><stop offset="1" stop-color="#0088FF"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#62E5FF" stroke-opacity="0.055"/></pattern>
  </defs>
  <rect width="1200" height="320" rx="26" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="318" rx="25" fill="none" stroke="#62E5FF" stroke-opacity="0.25"/><rect width="1200" height="320" rx="26" fill="url(#grid)"/>
  <path d="M0 257C185 218 260 300 438 266S730 220 900 257S1080 288 1200 242" fill="none" stroke="url(#g)" stroke-opacity="0.24" stroke-width="2"/>
  <g transform="translate(64 58)">
    <rect width="170" height="170" rx="38" fill="#07111C" stroke="#62E5FF" stroke-opacity="0.55"/>
    <circle cx="85" cy="85" r="57" fill="#02050A" stroke="#1C7398" stroke-width="4"/>
    <path d="M30 88H56L68 62L84 117L100 48L113 88H140" fill="none" stroke="url(#g)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="30" cy="88" r="5" fill="#62E5FF"/><circle cx="140" cy="88" r="5" fill="#0088FF"/>
    <circle cx="85" cy="19" r="6" fill="#62E5FF"/><circle cx="39" cy="40" r="5" fill="#0088FF"/><circle cx="132" cy="42" r="5" fill="#62E5FF"/>
  </g>
  <text x="280" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#62E5FF">SWIR PROJECT</text>
  <text x="280" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" fill="#F4FAFF">INFOPULSE PL</text>
  <text x="282" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" fill="#B8D2E0">RSS, public APIs and a Polish desktop dashboard.</text>
  <text x="282" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" letter-spacing="1.5" fill="#62E5FF">WINDOWS  •  PYTHON  •  CUSTOMTKINTER</text>
  <g transform="translate(1015 242)"><circle r="4" fill="#62E5FF"/><circle cx="25" r="4" fill="#0088FF"/><circle cx="50" r="4" fill="#62E5FF" opacity="0.5"/></g>
</svg>
