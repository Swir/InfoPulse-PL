name: Assemble source

on:
  push:
    paths:
      - 'parts/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Python source
        shell: bash
        run: |
          cat parts/part*.b64 | base64 -d > InfoPulse_PL_v2.py
          python -m py_compile InfoPulse_PL_v2.py
      - name: Commit generated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add InfoPulse_PL_v2.py
          git commit -m "feat: add InfoPulse PL v2 application" || exit 0
          git push
